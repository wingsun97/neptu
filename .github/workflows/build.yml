name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  PHP_8_3_CLI_TAG: ${{ github.repository }}:php-8.3-cli
  PHP_8_3_SVD_TAG: ${{ github.repository }}:php-8.3-svd
  PHP_8_3_DEV_TAG: ${{ github.repository }}:php-8.3-dev
  NODE_24_SLIM_TAG: ${{ github.repository }}:node-24-slim

jobs:
  php-8_3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect PHP 8.3 changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php-cli:
              - 'php-8.3/Dockerfile-Cli'
              - 'php-8.3/php.ini'
              - 'php-8.3/conf.d/**'
            php-svd:
              - 'php-8.3/Dockerfile-Svd'
              - 'php-8.3/supervisord.conf'
            php-dev:
              - 'php-8.3/Dockerfile-Dev'
              - 'php-8.3/php-dev.ini'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PHP 8.3 Cli tags
        id: php-8_3-cli-tags
        if: steps.filter.outputs.php-cli == 'true'
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ env.REGISTRY }}/${{ env.PHP_8_3_CLI_TAG }}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ env.REGISTRY }}/${{ env.PHP_8_3_CLI_TAG }}-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push PHP 8.3 Cli
        if: steps.filter.outputs.php-cli == 'true'
        uses: docker/build-push-action@v6
        with:
          context: php-8.3
          file: php-8.3/Dockerfile-Cli
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.php-8_3-cli-tags.outputs.tags }}

      - name: Generate PHP 8.3 Svd tags
        id: php-8_3-svd-tags
        if: steps.filter.outputs.php-cli == 'true' || steps.filter.outputs.php-svd == 'true'
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ env.REGISTRY }}/${{ env.PHP_8_3_SVD_TAG }}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ env.REGISTRY }}/${{ env.PHP_8_3_SVD_TAG }}-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push PHP 8.3 Svd
        if: steps.filter.outputs.php-cli == 'true' || steps.filter.outputs.php-svd == 'true'
        uses: docker/build-push-action@v6
        with:
          context: php-8.3
          file: php-8.3/Dockerfile-Svd
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.php-8_3-svd-tags.outputs.tags }}

      - name: Generate PHP 8.3 Dev tags
        id: php-8_3-dev-tags
        if: steps.filter.outputs.php-cli == 'true' || steps.filter.outputs.php-dev == 'true'
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ env.REGISTRY }}/${{ env.PHP_8_3_DEV_TAG }}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ env.REGISTRY }}/${{ env.PHP_8_3_DEV_TAG }}-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push PHP 8.3 Dev
        if: steps.filter.outputs.php-cli == 'true' || steps.filter.outputs.php-dev == 'true'
        uses: docker/build-push-action@v6
        with:
          context: php-8.3
          file: php-8.3/Dockerfile-Dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.php-8_3-dev-tags.outputs.tags }}

  node_24_slim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect Node 24 changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node-slim:
              - 'node-24/**'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Node 24 Slim tags
        id: node-24-slim-tags
        if: steps.filter.outputs.node-slim == 'true'
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ env.REGISTRY }}/${{ env.NODE_24_SLIM_TAG }}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ env.REGISTRY }}/${{ env.NODE_24_SLIM_TAG }}-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push Node 24 Slim
        if: steps.filter.outputs.node-slim == 'true'
        uses: docker/build-push-action@v6
        with:
          context: node-24
          file: node-24/Dockerfile-Slim
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.node-24-slim-tags.outputs.tags }}
